<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAINS — decisions</title>
<!--
  A READ-ONLY VIEWER. Roadmap "Demo assets", not console v1.

  There are no approve/reject buttons here, deliberately. Actions in the console
  are roadmap item 11, and a page that cannot write needs no CSRF story, no
  confirmation dialogs and no opinion about double-submits. Everything it does
  is a GET against an endpoint that already exists.

  THE API KEY IS HELD IN MEMORY ONLY — a closure variable, gone on reload.
  Never localStorage, never sessionStorage, never a URL parameter. The last of
  those is the one worth naming: a key in a query string is a key in the
  browser's history, in the Referer header of anything this page links to, and
  in the access logs of every proxy between here and the service. `api_keys`
  stores only sha256(key) precisely so a database dump cannot be replayed; it
  would be a poor trade to then leak the raw key into a log line.

  THE PAGE ITSELF IS SERVED UNAUTHENTICATED. It is static HTML with no data in
  it — every call it makes carries X-API-Key and is authorized server-side, so
  there is nothing to protect here that is not already protected there.

  EVERYTHING RENDERED IS ESCAPED. Lead titles, company names and the model's
  own rationale are untrusted text that arrived from outside; see the
  TriggerRequest docstring. `esc()` guards every interpolation, and no data
  reaches innerHTML without passing through it.
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --ink: #e6e9ef;
    --dim: #939cad; --accent: #7aa2f7;
    --ok: #2ea043; --warn: #d29922; --stop: #cf4b4b; --info: #4b8fcf;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea; --ink: #14171c;
      --dim: #5b6472; --accent: #2f5fd0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .tag { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(320px, 460px) 1fr; gap: 0;
         height: calc(100vh - 53px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  #list, #detail { overflow-y: auto; padding: 16px 20px; }
  #list { border-right: 1px solid var(--line); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
  }
  button { cursor: pointer; border-color: var(--accent); }
  button:hover { border-color: var(--ink); }
  .row {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel);
  }
  .row:hover { border-color: var(--accent); }
  .row.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .id { font-variant-numeric: tabular-nums; color: var(--dim); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .b {
    font-size: 11px; padding: 2px 7px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .b.ok { color: var(--ok); border-color: var(--ok); }
  .b.warn { color: var(--warn); border-color: var(--warn); }
  .b.stop { color: var(--stop); border-color: var(--stop); }
  .b.info { color: var(--info); border-color: var(--info); }
  h2 { font-size: 14px; margin: 22px 0 8px; text-transform: uppercase;
       letter-spacing: .08em; color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  pre { margin: 6px 0 0; padding: 10px; background: var(--bg);
        border: 1px solid var(--line); border-radius: 6px;
        overflow-x: auto; font-size: 12px; white-space: pre-wrap;
        word-break: break-word; }
  .step { border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 14px; }
  .step-h { font-weight: 600; }
  .err { color: var(--stop); }
  .muted { color: var(--dim); }
  .rationale { font-style: italic; }
  #gate { border-left: 3px solid var(--accent); }
</style>
</head>
<body>

<header>
  <h1>BRAINS</h1>
  <span class="tag">read-only decision viewer</span>
  <span class="tag" id="who"></span>
</header>

<main>
  <section id="list">
    <div class="controls">
      <input id="key" type="password" placeholder="X-API-Key" size="22"
             autocomplete="off">
      <button id="connect">Connect</button>
    </div>
    <div class="controls">
      <select id="status">
        <option value="">any status</option>
        <option>pending_approval</option>
        <option>auto_executed</option>
        <option>auto_discarded</option>
        <option>approved</option>
        <option>rejected</option>
        <option>needs_review</option>
        <option>processing</option>
      </select>
      <select id="dtype"><option value="">any type</option></select>
      <button id="refresh">Refresh</button>
    </div>
    <div id="rows"><p class="muted">Enter an API key to load decisions.</p></div>
  </section>

  <section id="detail">
    <p class="muted">Select a decision.</p>
  </section>
</main>

<script>
(() => {
  "use strict";

  // IN MEMORY ONLY. Not persisted anywhere, by design — see the comment at the
  // top of this file. Reloading the page deliberately forgets it.
  let API_KEY = null;

  const $ = (id) => document.getElementById(id);

  // Every value that reaches the DOM goes through here. Lead titles and the
  // model's rationale are attacker-influenced text.
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => (
    {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]
  ));

  const json = (v) => esc(JSON.stringify(v, null, 2));

  async function api(path) {
    const r = await fetch(path, { headers: { "X-API-Key": API_KEY } });
    if (!r.ok) {
      const body = await r.text();
      throw new Error(`${r.status} ${body.slice(0, 300)}`);
    }
    return r.json();
  }

  const STATUS_CLASS = {
    auto_executed: "ok", approved: "ok",
    pending_approval: "warn", processing: "warn",
    needs_review: "stop", rejected: "stop",
    auto_discarded: "info",
  };

  const bandClass = (b) => ({hot: "ok", warm: "warn", cold: "info"}[b] || "");

  function badge(text, cls) {
    return `<span class="b ${cls || ""}">${esc(text)}</span>`;
  }

  // --- List ---------------------------------------------------------------
  let selected = null;

  async function loadList() {
    if (!API_KEY) return;
    const params = new URLSearchParams({ limit: "100" });
    if ($("status").value) params.set("status", $("status").value);
    if ($("dtype").value) params.set("decision_type", $("dtype").value);

    const rows = $("rows");
    rows.innerHTML = `<p class="muted">Loading…</p>`;
    try {
      const items = await api(`/decisions?${params}`);
      if (!items.length) {
        rows.innerHTML = `<p class="muted">No decisions match.</p>`;
        return;
      }
      rows.innerHTML = items.map((d) => `
        <div class="row" data-id="${esc(d.id)}">
          <div class="row-top">
            <strong>${esc(d.proposed_action)}</strong>
            <span class="id">#${esc(d.id)}</span>
          </div>
          <div class="badges">
            ${badge(d.status, STATUS_CLASS[d.status])}
            ${d.score !== null ? badge(`score ${d.score}`) : ""}
            ${d.band ? badge(d.band, bandClass(d.band)) : ""}
            ${badge(d.decision_type)}
          </div>
        </div>`).join("");

      // Populate the type filter from what actually came back, so it can never
      // offer a type this build does not have.
      const types = [...new Set(items.map((d) => d.decision_type))].sort();
      const sel = $("dtype"), keep = sel.value;
      sel.innerHTML = `<option value="">any type</option>` +
        types.map((t) => `<option${t === keep ? " selected" : ""}>${esc(t)}</option>`).join("");

      rows.querySelectorAll(".row").forEach((el) => {
        el.addEventListener("click", () => showDetail(el.dataset.id));
      });
      if (selected) markSelected(selected);
    } catch (e) {
      rows.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    }
  }

  function markSelected(id) {
    document.querySelectorAll(".row").forEach((el) => {
      el.classList.toggle("sel", el.dataset.id === String(id));
    });
  }

  // --- Detail -------------------------------------------------------------
  async function showDetail(id) {
    selected = id;
    markSelected(id);
    const pane = $("detail");
    pane.innerHTML = `<p class="muted">Loading #${esc(id)}…</p>`;
    try {
      const d = await api(`/decisions/${encodeURIComponent(id)}`);
      pane.innerHTML = renderDetail(d);
    } catch (e) {
      pane.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    }
  }

  function renderDetail(d) {
    const r = d.reasoning || {};
    // The loop stores the parsed proposal on `final`; older rows may carry it
    // at the top level.
    const proposal = (r.final && r.final.proposal) || r.proposal || {};
    const gate = r.gate || {};
    const ev = r.evidence || {};
    const steps = r.iterations || [];

    const gateBadges = [
      badge(d.status, STATUS_CLASS[d.status]),
      gate.policy_source ? badge(`policy: ${gate.policy_source}`,
        gate.policy_source === "fallback_unreadable" ? "stop" : "info") : "",
      ...(gate.blockers || []).map((b) => badge(b, "stop")),
    ].join("");

    return `
      <h2>Decision #${esc(d.id)}</h2>
      <div class="card">
        <div class="kv">
          <div>status</div><div>${esc(d.status)}</div>
          <div>proposed action</div><div>${esc(d.proposed_action)}</div>
          <div>score / band</div><div>${esc(d.score)} · ${esc(d.band)}</div>
          <div>decision type</div><div>${esc(d.decision_type)}</div>
          <div>rules version</div><div>${esc(d.rules_version)}</div>
          <div>created</div><div>${esc(d.created_at)}</div>
          ${d.decided_by ? `<div>decided by</div><div>${esc(d.decided_by)}</div>` : ""}
        </div>
      </div>

      <h2>Gate</h2>
      <div class="card" id="gate">
        <div class="badges">${gateBadges}</div>
        <div class="kv" style="margin-top:10px">
          <div>rule</div><div>${esc(gate.rule)}</div>
          <div>detail</div><div>${esc(gate.detail)}</div>
          <div>policy source</div><div>${esc(gate.policy_source)}</div>
          ${gate.policy_error ? `<div>policy error</div><div class="err">${esc(gate.policy_error)}</div>` : ""}
        </div>
      </div>

      <h2>Evidence <span class="tag">— the deterministic facts the gate saw</span></h2>
      <div class="card"><pre>${json(ev)}</pre></div>

      <h2>Model proposal</h2>
      <div class="card">
        <div class="kv">
          <div>action</div><div>${esc(proposal.proposed_action)}</div>
          <div>confidence</div><div>${esc(proposal.confidence)}</div>
        </div>
        <p class="rationale">${esc(proposal.rationale)}</p>
      </div>

      <h2>Trace <span class="tag">— ${esc(steps.length)} step(s), model ${esc(r.model)}</span></h2>
      ${steps.map(renderStep).join("") || `<p class="muted">No tool calls recorded.</p>`}

      <h2>Outcomes <span class="tag">— newest first; corrections are new rows</span></h2>
      ${(d.outcomes || []).length
        ? d.outcomes.map((o) => `
            <div class="card">
              <div class="badges">
                ${badge(o.outcome, o.outcome === "converted" ? "ok"
                    : (o.outcome === "lost" || o.outcome === "invalid") ? "stop" : "info")}
                ${o.value_usd !== null ? badge(`$${esc(o.value_usd)}`) : ""}
                ${badge(o.recorded_by)}
              </div>
              ${o.note ? `<p class="muted">${esc(o.note)}</p>` : ""}
              <div class="tag">${esc(o.created_at)}</div>
            </div>`).join("")
        : `<p class="muted">Nothing recorded yet.</p>`}
    `;
  }

  function renderStep(s) {
    return `
      <div class="step">
        <div class="step-h">${esc(s.index)}. ${esc(s.tool)}
          ${s.is_error ? `<span class="err">· error</span>` : ""}</div>
        ${s.intent ? `<p class="muted">${esc(s.intent)}</p>` : ""}
        <div class="tag">args</div><pre>${json(s.args)}</pre>
        <div class="tag">result</div><pre>${json(s.result)}</pre>
      </div>`;
  }

  // --- Wiring -------------------------------------------------------------
  $("connect").addEventListener("click", () => {
    API_KEY = $("key").value.trim() || null;
    // Clear the input so the key is not sitting in a form field, and so a
    // screen share after connecting does not show it.
    $("key").value = "";
    $("who").textContent = API_KEY ? "connected (key held in memory only)" : "";
    selected = null;
    $("detail").innerHTML = `<p class="muted">Select a decision.</p>`;
    loadList();
  });
  $("key").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("connect").click();
  });
  $("refresh").addEventListener("click", loadList);
  $("status").addEventListener("change", loadList);
  $("dtype").addEventListener("change", loadList);
})();
</script>
</body>
</html>
